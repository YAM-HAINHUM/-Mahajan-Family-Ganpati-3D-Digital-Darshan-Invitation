<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3D1" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#E6C875" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#C99A3D" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8E1B23" stop-opacity="0" />
    </radialGradient>
    <filter id="sacredGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <circle cx="250" cy="250" r="240" fill="none" stroke="#C99A3D" stroke-width="1.5" stroke-dasharray="4,8" opacity="0.4" />
  <circle cx="250" cy="250" r="225" fill="none" stroke="#E6C875" stroke-width="2" opacity="0.6" />
  <circle cx="250" cy="250" r="215" fill="none" stroke="#C99A3D" stroke-width="1" stroke-dasharray="2,6" opacity="0.5" />
  <circle cx="250" cy="250" r="180" fill="none" stroke="#E6C875" stroke-width="2.5" opacity="0.7" />
  <circle cx="250" cy="250" r="150" fill="none" stroke="#C99A3D" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6" />
  <circle cx="250" cy="250" r="100" fill="none" stroke="#E6C875" stroke-width="2" opacity="0.75" />
  <circle cx="250" cy="250" r="60" fill="none" stroke="#C99A3D" stroke-width="1.5" opacity="0.8" />
  <circle cx="250" cy="250" r="25" fill="#E6C875" fill-opacity="0.2" stroke="#FFF3D1" stroke-width="2" />

  <!-- 16 Outer Lotus Petals -->
  <g stroke="#E6C875" stroke-width="1.8" fill="none" opacity="0.65" filter="url(#sacredGlow)">
    <path d="M 250,25 C 240,70 230,120 250,180 C 270,120 260,70 250,25 Z" transform="rotate(0 250 250)" />
    <path d="M 250,25 C 240,70 230,120 250,180 C 270,120 260,70 250,25 Z" transform="rotate(22.5 250 250)" />
    <path d="M 250,25 C 240,70 230,120 250,180 C 270,120 260,70 250,25 Z" transform="rotate(45 250 250)" />
    <path d="M 250,25 C 240,70 230,120 250,180 C 270,120 260,70 250,25 Z" transform="rotate(67.5 250 250)" />
    <path d="M 250,25 C 240,70 230,120 250,180 C 270,120 260,70 250,25 Z" transform="rotate(90 250 250)" />
    <path d="M 250,25 C 240,70 230,120 250,180 C 270,120 260,70 250,25 Z" transform="rotate(112.5 250 250)" />
    <path d="M 250,25 C 240,70 230,120 250,180 C 270,120 260,70 250,25 Z" transform="rotate(135 250 250)" />
    <path d="M 250,25 C 240,70 230,120 250,180 C 270,120 260,70 250,25 Z" transform="rotate(157.5 250 250)" />
    <path d="M 250,25 C 240,70 230,120 250,180 C 270,120 260,70 250,25 Z" transform="rotate(180 250 250)" />
    <path d="M 250,25 C 240,70 230,120 250,180 C 270,120 260,70 250,25 Z" transform="rotate(202.5 250 250)" />
    <path d="M 250,25 C 240,70 230,120 250,180 C 270,120 260,70 250,25 Z" transform="rotate(225 250 250)" />
    <path d="M 250,25 C 240,70 230,120 250,180 C 270,120 260,70 250,25 Z" transform="rotate(247.5 250 250)" />
    <path d="M 250,25 C 240,70 230,120 250,180 C 270,120 260,70 250,25 Z" transform="rotate(270 250 250)" />
    <path d="M 250,25 C 240,70 230,120 250,180 C 270,120 260,70 250,25 Z" transform="rotate(292.5 250 250)" />
    <path d="M 250,25 C 240,70 230,120 250,180 C 270,120 260,70 250,25 Z" transform="rotate(315 250 250)" />
    <path d="M 250,25 C 240,70 230,120 250,180 C 270,120 260,70 250,25 Z" transform="rotate(337.5 250 250)" />
  </g>

  <!-- 12 Mid Ring Rays & Petals -->
  <g stroke="#C99A3D" stroke-width="1.6" fill="none" opacity="0.75">
    <path d="M 250,70 Q 235,110 250,150 Q 265,110 250,70 Z" transform="rotate(0 250 250)" />
    <path d="M 250,70 Q 235,110 250,150 Q 265,110 250,70 Z" transform="rotate(30 250 250)" />
    <path d="M 250,70 Q 235,110 250,150 Q 265,110 250,70 Z" transform="rotate(60 250 250)" />
    <path d="M 250,70 Q 235,110 250,150 Q 265,110 250,70 Z" transform="rotate(90 250 250)" />
    <path d="M 250,70 Q 235,110 250,150 Q 265,110 250,70 Z" transform="rotate(120 250 250)" />
    <path d="M 250,70 Q 235,110 250,150 Q 265,110 250,70 Z" transform="rotate(150 250 250)" />
    <path d="M 250,70 Q 235,110 250,150 Q 265,110 250,70 Z" transform="rotate(180 250 250)" />
    <path d="M 250,70 Q 235,110 250,150 Q 265,110 250,70 Z" transform="rotate(210 250 250)" />
    <path d="M 250,70 Q 235,110 250,150 Q 265,110 250,70 Z" transform="rotate(240 250 250)" />
    <path d="M 250,70 Q 235,110 250,150 Q 265,110 250,70 Z" transform="rotate(270 250 250)" />
    <path d="M 250,70 Q 235,110 250,150 Q 265,110 250,70 Z" transform="rotate(300 250 250)" />
    <path d="M 250,70 Q 235,110 250,150 Q 265,110 250,330 Z" transform="rotate(330 250 250)" />
  </g>

  <!-- 8 Inner Lotus Filigree -->
  <g stroke="#FFF3D1" stroke-width="1.8" fill="none" opacity="0.85">
    <path d="M 250,100 C 242,125 240,140 250,160 C 260,140 258,125 250,100 Z" transform="rotate(0 250 250)" />
    <path d="M 250,100 C 242,125 240,140 250,160 C 260,140 258,125 250,100 Z" transform="rotate(45 250 250)" />
    <path d="M 250,100 C 242,125 240,140 250,160 C 260,140 258,125 250,100 Z" transform="rotate(90 250 250)" />
    <path d="M 250,100 C 242,125 240,140 250,160 C 260,140 258,125 250,100 Z" transform="rotate(135 250 250)" />
    <path d="M 250,100 C 242,125 240,140 250,160 C 260,140 258,125 250,100 Z" transform="rotate(180 250 250)" />
    <path d="M 250,100 C 242,125 240,140 250,160 C 260,140 258,125 250,100 Z" transform="rotate(225 250 250)" />
    <path d="M 250,100 C 242,125 240,140 250,160 C 260,140 258,125 250,100 Z" transform="rotate(270 250 250)" />
    <path d="M 250,100 C 242,125 240,140 250,160 C 260,140 258,125 250,100 Z" transform="rotate(315 250 250)" />
  </g>

  <!-- Dots & Embellishments -->
  <g fill="#E6C875" opacity="0.9">
    <circle cx="250" cy="30" r="3.5" transform="rotate(0 250 250)" />
    <circle cx="250" cy="30" r="3.5" transform="rotate(22.5 250 250)" />
    <circle cx="250" cy="30" r="3.5" transform="rotate(45 250 250)" />
    <circle cx="250" cy="30" r="3.5" transform="rotate(67.5 250 250)" />
    <circle cx="250" cy="30" r="3.5" transform="rotate(90 250 250)" />
    <circle cx="250" cy="30" r="3.5" transform="rotate(112.5 250 250)" />
    <circle cx="250" cy="30" r="3.5" transform="rotate(135 250 250)" />
    <circle cx="250" cy="30" r="3.5" transform="rotate(157.5 250 250)" />
    <circle cx="250" cy="30" r="3.5" transform="rotate(180 250 250)" />
    <circle cx="250" cy="30" r="3.5" transform="rotate(202.5 250 250)" />
    <circle cx="250" cy="30" r="3.5" transform="rotate(225 250 250)" />
    <circle cx="250" cy="30" r="3.5" transform="rotate(247.5 250 250)" />
    <circle cx="250" cy="30" r="3.5" transform="rotate(270 250 250)" />
    <circle cx="250" cy="30" r="3.5" transform="rotate(292.5 250 250)" />
    <circle cx="250" cy="30" r="3.5" transform="rotate(315 250 250)" />
    <circle cx="250" cy="30" r="3.5" transform="rotate(337.5 250 250)" />
  </g>
</svg>
