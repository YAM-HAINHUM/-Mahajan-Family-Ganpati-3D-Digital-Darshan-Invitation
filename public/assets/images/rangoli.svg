<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C99A3D" stop-opacity="0" />
      <stop offset="20%" stop-color="#C99A3D" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFF3D1" stop-opacity="1" />
      <stop offset="80%" stop-color="#C99A3D" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C99A3D" stop-opacity="0" />
