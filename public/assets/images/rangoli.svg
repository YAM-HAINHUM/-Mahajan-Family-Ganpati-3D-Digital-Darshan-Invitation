  </defs>

  <!-- Central Lotus Motifs -->
  <path d="M 300,30 C 290,45 285,60 300,75 C 315,60 310,45 300,30 Z" fill="#E6C875" opacity="0.9" />
  <path d="M 300,35 C 280,50 270,65 290,75 C 295,65 295,50 300,35 Z" fill="#C99A3D" opacity="0.75" />
  <path d="M 300,35 C 320,50 330,65 310,75 C 305,65 305,50 300,35 Z" fill="#C99A3D" opacity="0.75" />
  <circle cx="300" cy="55" r="4" fill="#FFF8E8" />

  <!-- Symmetrical Ornamental Vines Left -->
  <path d="M 280,60 C 250,55 220,68 190,58 C 160,48 130,65 100,58 C 70,51 40,62 0,60" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
  <path d="M 270,60 C 240,65 210,52 180,62 C 150,72 120,55 90,62 C 60,69 30,58 0,60" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="3,3" />

  <!-- Symmetrical Ornamental Vines Right -->
  <path d="M 320,60 C 350,55 380,68 410,58 C 440,48 470,65 500,58 C 530,51 560,62 600,60" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
  <path d="M 330,60 C 360,65 390,52 420,62 C 450,72 480,55 510,62 C 540,69 570,58 600,60" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="3,3" />

  <!-- Kalash & Paisley accents -->
  <circle cx="230" cy="60" r="3" fill="#E6C875" />
  <circle cx="370" cy="60" r="3" fill="#E6C875" />
  <circle cx="160" cy="58" r="2.5" fill="#E6C875" />
  <circle cx="440" cy="58" r="2.5" fill="#E6C875" />
  <circle cx="90" cy="60" r="2" fill="#E6C875" />
  <circle cx="510" cy="60" r="2" fill="#E6C875" />
</svg>
