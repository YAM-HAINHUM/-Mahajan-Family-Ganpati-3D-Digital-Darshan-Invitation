<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D1" />
      <stop offset="35%" stop-color="#E6C875" />
      <stop offset="70%" stop-color="#C99A3D" />
      <stop offset="100%" stop-color="#8C6527" />
    </linearGradient>
    <radialGradient id="flameGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="25%" stop-color="#FFE885" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#FF7A00" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#D92B00" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Diya Stand / Base -->
  <ellipse cx="50" cy="86" rx="26" ry="6" fill="#8C6527" opacity="0.6" />
  <path d="M 36,84 C 36,80 44,78 50,78 C 56,78 64,80 64,84 Z" fill="url(#brassGrad)" />
  <rect x="47" y="72" width="6" height="8" rx="2" fill="url(#brassGrad)" />

  <!-- Diya Bowl -->
  <path d="M 20,62 C 24,76 76,76 80,62 C 84,54 75,54 50,56 C 25,54 16,54 20,62 Z" fill="url(#brassGrad)" stroke="#FFE885" stroke-width="0.8" />
  <ellipse cx="50" cy="56" rx="28" ry="4" fill="#8C6527" />
  <ellipse cx="50" cy="56" rx="25" ry="3" fill="#D97706" opacity="0.7" />

  <!-- Diya Flame Glow Halo -->
  <circle cx="50" cy="38" r="22" fill="url(#flameGlow)" opacity="0.8" />

  <!-- Inner Flame -->
  <path d="M 50,20 C 44,32 42,42 50,48 C 58,42 56,32 50,20 Z" fill="#FF5E00" />
  <path d="M 50,24 C 46,33 45,40 50,45 C 55,40 54,33 50,24 Z" fill="#FFC72C" />
  <path d="M 50,30 C 48,35 48,39 50,42 C 52,39 52,35 50,30 Z" fill="#FFFFFF" />
